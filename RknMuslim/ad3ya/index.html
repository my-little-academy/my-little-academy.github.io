<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكاري اليومية - المسلم الصغير</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية الرموز الإسلامية المتحركة */
        .islamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .symbol {
            position: absolute;
            font-size: 40px;
            opacity: 0.1;
            animation: float 20s infinite;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-100px) rotate(90deg);
            }
            50% {
                transform: translateY(-50px) rotate(180deg);
            }
            75% {
                transform: translateY(-150px) rotate(270deg);
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: slideDown 0.8s ease-out;
            border: 5px solid #4facfe;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #4facfe;
            font-size: 2.8em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #f5576c;
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            border-radius: 20px;
            text-align: center;
            flex: 1;
            min-width: 150px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
            border: 3px solid white;
        }

        .stat-box:hover {
            transform: translateY(-8px);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 1em;
            margin-top: 8px;
            font-weight: 600;
        }

        .adhkar-container {
            display: grid;
            gap: 25px;
            margin-bottom: 40px;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        }

        .dhikr-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out;
            border: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .dhikr-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .dhikr-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            border-color: #4facfe;
        }

        .dhikr-card.completed {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .dhikr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #e0e0e0;
        }

        .dhikr-title {
            font-size: 1.4em;
            color: #4facfe;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            font-size: 1.8em;
        }

        .dhikr-text {
            font-size: 1.4em;
            line-height: 1.9;
            color: #2d3436;
            margin: 20px 0;
            padding: 20px;
            background: rgba(79, 172, 254, 0.08);
            border-radius: 20px;
            text-align: center;
            border-right: 4px solid #4facfe;
            font-weight: 600;
        }

        .dhikr-meaning {
            color: #636e72;
            font-size: 1em;
            margin: 15px 0;
            padding: 15px;
            background: rgba(245, 87, 108, 0.08);
            border-radius: 15px;
            border-right: 3px solid #f5576c;
            font-weight: 500;
        }

        .counter-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 20px;
            background: rgba(79, 172, 254, 0.1);
            border-radius: 20px;
        }

        .counter-display {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .counter-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-count {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-count:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.4);
        }

        .btn-count:active {
            transform: scale(0.95);
        }

        .btn-reset {
            background: #f59e0b;
            color: white;
            padding: 12px 20px;
            font-size: 1.2em;
        }

        .btn-reset:hover {
            background: #d97706;
            transform: scale(1.05);
        }

        .completion-badge {
            display: inline-block;
            padding: 8px 15px;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.9em;
            animation: pulse 1s infinite;
            font-weight: 700;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .category-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .tab {
            padding: 12px 25px;
            background: white;
            border: 3px solid #4facfe;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 700;
            color: #4facfe;
        }

        .tab:hover {
            background: #4facfe;
            color: white;
            transform: translateY(-3px);
        }

        .tab.active {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.3);
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(79, 172, 254, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            animation: celebrate 1s ease-out;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes celebrate {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(2);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .adhkar-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .dhikr-text {
                font-size: 1.2em;
                padding: 15px;
            }
            
            .counter-section {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .stats-container {
                gap: 10px;
            }
            
            .stat-box {
                min-width: 120px;
                padding: 15px;
            }
        }

        /* رأس الصفحة للصغار */
        .kid-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .kid-emoji {
            font-size: 3em;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>

        let currentCounts = {};
        let currentFilter = 'all';
        let streakDays = 0;

        // تهيئة العدادات
        adhkarData.forEach(dhikr => {
            currentCounts[dhikr.id] = 0;
        });

        // إنشاء الخلفية المتحركة
        function createIslamicBackground() {
            const bg = document.getElementById('islamicBg');
            const symbols = ['☪️', '🕌', '📿', '🌙', '⭐', '✨', '🤲'];
            
            for (let i = 0; i < 25; i++) {
                const symbol = document.createElement('div');
                symbol.className = 'symbol';
                symbol.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                symbol.style.left = Math.random() * 100 + '%';
                symbol.style.top = Math.random() * 100 + '%';
                symbol.style.animationDelay = Math.random() * 10 + 's';
                symbol.style.animationDuration = (15 + Math.random() * 10) + 's';
                bg.appendChild(symbol);
            }
        }

        // عرض الأذكار
        function renderAdhkar() {
            const container = document.getElementById('adhkarContainer');
            container.innerHTML = '';
            
            const filteredAdhkar = currentFilter === 'all' 
                ? adhkarData 
                : adhkarData.filter(d => d.category === currentFilter);

            filteredAdhkar.forEach(dhikr => {
                const card = document.createElement('div');
                card.className = 'dhikr-card';
                if (currentCounts[dhikr.id] >= dhikr.targetCount) {
                    card.classList.add('completed');
                }

                const progress = Math.min((currentCounts[dhikr.id] / dhikr.targetCount) * 100, 100);

                card.innerHTML = `
                    <div class="dhikr-header">
                        <div class="dhikr-title">
                            <span class="icon">${dhikr.icon}</span>
                            <span>${dhikr.title}</span>
                        </div>
                        ${currentCounts[dhikr.id] >= dhikr.targetCount ? 
                            '<span class="completion-badge">✓ مكتمل</span>' : ''}
                    </div>
                    <div class="dhikr-text">${dhikr.text}</div>
                    <div class="dhikr-meaning">💡 ${dhikr.meaning}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div class="counter-section">
                        <div class="counter-display">
                            <span id="count-${dhikr.id}">${currentCounts[dhikr.id]}</span> / ${dhikr.targetCount}
                        </div>
                        <div class="counter-buttons">
                            <button class="btn btn-count" onclick="incrementCount(${dhikr.id})">
                                ➕ ذِكْر
                            </button>
                            <button class="btn btn-reset" onclick="resetCount(${dhikr.id})">
                                🔄
                            </button>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
            
            updateStats();
        }

        // زيادة العداد
        function incrementCount(id) {
            const dhikr = adhkarData.find(d => d.id === id);
            if (currentCounts[id] < dhikr.targetCount) {
                currentCounts[id]++;
                updateDisplay(id);
                
                if (currentCounts[id] === dhikr.targetCount) {
                    celebrate();
                    renderAdhkar();
                }
                
                updateStats();
                saveProgress();
                updateStreak();
            }
        }

        // تحديث العرض
        function updateDisplay(id) {
            const countElement = document.getElementById(`count-${id}`);
            if (countElement) {
                countElement.textContent = currentCounts[id];
                
                const card = countElement.closest('.dhikr-card');
                if (card) {
                    const dhikr = adhkarData.find(d => d.id === id);
                    const progress = Math.min((currentCounts[id] / dhikr.targetCount) * 100, 100);
                    const progressFill = card.querySelector('.progress-fill');
                    if (progressFill) {
                        progressFill.style.width = progress + '%';
                    }
                    
                    if (currentCounts[id] >= dhikr.targetCount && !card.classList.contains('completed')) {
                        card.classList.add('completed');
                        const badge = card.querySelector('.completion-badge');
                        if (badge) {
                            badge.textContent = '✓ مكتمل';
                        }
                    }
                }
            }
        }

        // إعادة تعيين العداد
        function resetCount(id) {
            currentCounts[id] = 0;
            updateDisplay(id);
            updateStats();
            saveProgress();
        }

        // تحديث الإحصائيات
        function updateStats() {
            const total = Object.values(currentCounts).reduce((a, b) => a + b, 0);
            const completed = adhkarData.filter(d => currentCounts[d.id] >= d.targetCount).length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('streakDays').textContent = streakDays;
        }

        // الاحتفال
        function celebrate() {
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.textContent = '🎉';
            document.body.appendChild(celebration);
            
            setTimeout(() => {
                celebration.remove();
            }, 1000);
        }

        // تصفية حسب الفئة
        function filterCategory(category) {
            currentFilter = category;
            
            // تحديث الأزرار
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderAdhkar();
        }

        // تحديث الأيام المتتالية
        function updateStreak() {
            const today = new Date().toDateString();
            const lastVisit = localStorage.getItem('lastVisitDate');
            
            if (!lastVisit) {
                streakDays = 1;
            } else {
                const lastDate = new Date(lastVisit);
                const todayDate = new Date(today);
                const diffTime = Math.abs(todayDate - lastDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays === 1) {
                    streakDays = parseInt(localStorage.getItem('streakDays') || '0') + 1;
                } else if (diffDays > 1) {
                    streakDays = 1;
                }
            }
            
            localStorage.setItem('streakDays', streakDays.toString());
            localStorage.setItem('lastVisitDate', today);
        }

        // حفظ التقدم
        function saveProgress() {
            localStorage.setItem('adhkarProgress', JSON.stringify(currentCounts));
        }

        // تحميل التقدم
        function loadProgress() {
            const saved = localStorage.getItem('adhkarProgress');
            if (saved) {
                currentCounts = JSON.parse(saved);
            }
            
            streakDays = parseInt(localStorage.getItem('streakDays') || '0');
        }

        // التهيئة
        function init() {
            createIslamicBackground();
            loadProgress();
            updateStreak();
            renderAdhkar();
        }

        // تشغيل التطبيق
        window.addEventListener('DOMContentLoaded', init);
    </script>
