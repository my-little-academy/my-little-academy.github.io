        }

        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;

                linear-gradient(to bottom, #1A2332 0%, #2D3548 50%, #1F2B3A 100%);

        .floating-icons {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-icon {
            position: absolute;
            font-size: 2em;
            opacity: 0.1;
            animation: floatIcon 20s infinite linear;
        }

        @keyframes floatIcon {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(100px, -50px) rotate(90deg); }
            50% { transform: translate(0, -100px) rotate(180deg); }
            75% { transform: translate(-100px, -50px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .hero-section {
            text-align: center;
            padding: 80px 20px;
            position: relative;
        }

        .hero-title {
            font-family: 'Amiri', serif;
            font-size: 4em;
            background: linear-gradient(45deg, #D4AF37, #6A0DAD, #2C5F8A);

        }

        .hero-subtitle {
            font-size: 1.5em;
            color: var(--parchment-beige);
            margin-bottom: 40px;
        }

        .category-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

            background: rgba(106, 13, 173, 0.1);

            border-radius: 50px;
            color: var(--parchment-beige);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
        }

            background: linear-gradient(135deg, var(--feminine-gold), var(--creative-purple));
            color: var(--night-blue);
            transform: translateY(-3px);
        }

        .women-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .woman-card {
            background: linear-gradient(135deg, rgba(30, 40, 55, 0.9), rgba(45, 60, 80, 0.9));
            border: 2px solid var(--feminine-gold);
            border-radius: 25px;
            padding: 30px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .woman-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(106, 13, 173, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card-icon {
            font-size: 3em;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--feminine-gold), var(--creative-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-family: 'Amiri', serif;
            font-size: 2.2em;
            color: var(--feminine-gold);
        }

        .card-subtitle {
            color: var(--parchment-beige);
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .card-period {
            background: rgba(212, 175, 55, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .card-description {
            line-height: 1.8;
            margin-bottom: 20px;
            color: var(--pearl-white);
        }

        .achievements {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .achievement-tag {
            background: rgba(44, 95, 138, 0.3);
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 0.9em;
            border: 1px solid rgba(44, 95, 138, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(30, 40, 55, 0.95), rgba(45, 60, 80, 0.95));
            border: 3px solid var(--feminine-gold);
            border-radius: 30px;
            padding: 40px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;

        .close-modal {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--passion-red);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;

        }

        .modal-body {

            margin-bottom: 30px;

            font-size: 1.8em;
            border-right: 4px solid var(--feminine-gold);
            padding-right: 15px;

                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

                name: "خديجة بنت خويلد",
                title: "أم المؤمنين ورائدة الأعمال",
                period: "68 ق.هـ-3هـ / 556-619م",
                category: "leadership",
                icon: "💼",
                description: "أول امرأة آمنت بالنبي محمد ﷺ، وكانت سيدة أعمال ناجحة تدير أكبر تجارة في مكة.",
                achievements: ["سيدة أعمال ناجحة", "أول المؤمنين", "داعمة الدعوة"],
                detailedInfo: {
                    birth: "من قبيلة قريش في مكة",
                    education: "برعت في التجارة والإدارة",
                    contributions: [
                        "كانت تدير تجارة كبيرة بين اليمن والشام",
                        "وظفت النبي محمد ﷺ ثم تزوجته",
                        "كانت الداعم المالي الأول للدعوة الإسلامية"
                    ],
                    quotes: ["كلا والله لا يخزيك الله أبداً، إنك لتصل الرحم، وتصدق الحديث، وتحمل الكل، وتقري الضيف، وتعين على نوائب الحق"],
                    legacy: "تعتبر نموذجاً للمرأة الناجحة في التجارة والإدارة، والسند القوي للدعوة الإسلامية"
                }
            }
        ];

        // إنشاء الأيقونات الطافية
        const iconsContainer = document.getElementById('floatingIcons');
        const womanIcons = ['👩‍🎓', '👩‍🔬', '👩‍💼', '👩‍⚖️', '👩‍🎨', '👩‍🏫', '👩‍⚕️', '👩‍🌾'];
        
        for (let i = 0; i < 30; i++) {
            const icon = document.createElement('div');
            icon.className = 'floating-icon';
            icon.textContent = womanIcons[Math.floor(Math.random() * womanIcons.length)];
            icon.style.left = Math.random() * 100 + '%';
            icon.style.top = Math.random() * 100 + '%';
            icon.style.animationDelay = Math.random() * 20 + 's';
            icon.style.fontSize = (Math.random() * 1 + 1.5) + 'em';
            iconsContainer.appendChild(icon);
        }

        // عرض البطاقات
        const womenGrid = document.getElementById('womenGrid');
        
        function displayWomen(womenArray) {
            womenGrid.innerHTML = '';
            womenArray.forEach(woman => {
                const card = document.createElement('div');
                card.className = 'woman-card';
                card.dataset.category = woman.category;
                card.onclick = () => openModal(woman);
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon">${woman.icon}</div>
                        <div>
                            <h3 class="card-title">${woman.name}</h3>
                            <p class="card-subtitle">${woman.title}</p>
                        </div>
                    </div>
                    <div class="card-period">${woman.period}</div>
                    <p class="card-description">${woman.description}</p>
                    <div class="achievements">
                        ${woman.achievements.map(ach => `<span class="achievement-tag">${ach}</span>`).join('')}
                    </div>
                `;
                
                womenGrid.appendChild(card);
            });
        }

        // التصفية حسب التصنيف
        function filterWomen(category) {
            // تحديث الأزرار النشطة
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            if (category === 'all') {
                displayWomen(muslimWomen);
            } else {
                const filtered = muslimWomen.filter(woman => woman.category === category);
                displayWomen(filtered);
            }
        }

        // فتح النافذة المنبثقة
        function openModal(woman) {
            const modal = document.getElementById('womanModal');
            const modalContent = document.getElementById('modalContent');
            
            modalContent.innerHTML = `
                <div class="modal-header" style="text-align: center; margin-bottom: 30px;">
                    <div style="font-size: 4em; margin-bottom: 20px;">${woman.icon}</div>
                    <h2 style="font-size: 2.5em; color: var(--feminine-gold); margin-bottom: 10px;">${woman.name}</h2>
                    <h3 style="color: var(--parchment-beige); font-size: 1.5em; margin-bottom: 20px;">${woman.title}</h3>
                    <div style="background: var(--creative-purple); color: white; padding: 10px 30px; border-radius: 25px; display: inline-block;">
                        ${woman.period}
                    </div>
                </div>
                
                <div class="modal-body">
                    <div class="modal-section">
                        <h3>المولد والنشأة</h3>
                        <p style="line-height: 1.8; font-size: 1.1em;">${woman.detailedInfo.birth}</p>
                        <p style="line-height: 1.8; font-size: 1.1em; margin-top: 10px;">${woman.detailedInfo.education}</p>
                    </div>
                    
                    <div class="modal-section">
                        <h3>الإسهامات والإنجازات</h3>
                        <ul style="line-height: 1.8; font-size: 1.1em; padding-right: 20px;">
                            ${woman.detailedInfo.contributions.map(cont => `<li>${cont}</li>`).join('')}
                        </ul>
                    </div>
                    
                    ${woman.detailedInfo.quotes.length > 0 ? `
                    <div class="modal-section">
                        <h3>من أقوالها الخالدة</h3>
                        <div style="background: rgba(212, 175, 55, 0.1); padding: 20px; border-radius: 15px; border-right: 4px solid var(--feminine-gold); margin-top: 15px;">
                            ${woman.detailedInfo.quotes.map(quote => `<p style="font-style: italic; font-size: 1.2em; line-height: 1.6;">${quote}</p>`).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    <div class="modal-section">
                        <h3>الإرث والتأثير</h3>
                        <p style="line-height: 1.8; font-size: 1.1em;">${woman.detailedInfo.legacy}</p>
                    </div>
                    
                    <div class="modal-section">
                        <h3>المجالات التي برعت فيها</h3>
                        <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px;">
                            ${woman.achievements.map(ach => `
                                <span style="background: rgba(44, 95, 138, 0.3); padding: 10px 20px; border-radius: 20px; border: 1px solid rgba(44, 95, 138, 0.5);">
                                    ${ach}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            
            modal.style.display = 'flex';
        }

        // إغلاق النافذة المنبثقة
        function closeModal() {
            document.getElementById('womanModal').style.display = 'none';
        }

        // التهيئة
        window.onload = function() {
            displayWomen(muslimWomen);
            
            // إغلاق النافذة المنبثقة بالنقر خارجها
            document.getElementById('womanModal').onclick = function(e) {
                if (e.target === this) {
                    closeModal();
                }
            };
        };
    </script>
</body>
</html>
