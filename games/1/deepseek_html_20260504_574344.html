<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>لغز الكلمات المتقاطعة - أركان الإسلام والإيمان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #1B5E20;
            --primary-light: #4CAF50;
            --primary-dark: #0D3B0F;
            --secondary: #FFC107;
            --secondary-light: #FFD54F;
            --success: #4CAF50;
            --success-light: #A5D6A7;
            --error: #F44336;
            --info: #2196F3;
            --bg-gradient-start: #F1F8E9;
            --bg-gradient-end: #C8E6C9;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-dark: #2E3B2E;
            --text-light: #5D6B5D;
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.15);
            --shadow-glow: 0 0 20px rgba(76, 175, 80, 0.4);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* تأثير الخلفية المتلألئة */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(76, 175, 80, 0.15), transparent);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
            50% { transform: translateY(-80px) rotate(180deg); opacity: 0.5; }
        }

        /* الحاوية الرئيسية */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* بطاقة اللعبة */
        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(5px);
            border-radius: 48px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: slideInUp 0.6s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* الهيدر */
        .game-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 30px 40px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .game-header::before {
            content: '🕌';
            position: absolute;
            font-size: 150px;
            opacity: 0.1;
            bottom: -30px;
            left: -30px;
            transform: rotate(-15deg);
        }

        .game-header::after {
            content: '⭐';
            position: absolute;
            font-size: 100px;
            opacity: 0.1;
            top: -20px;
            right: -20px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }

        /* زر العودة */
        .home-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            background: var(--secondary);
            color: var(--primary-dark);
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            z-index: 100;
            font-size: 1rem;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            background: var(--secondary-light);
            box-shadow: var(--shadow-lg);
        }

        /* مؤشر التقدم */
        .progress-section {
            padding: 20px 40px 0 40px;
        }

        .progress-bar-container {
            background: #E0E0E0;
            border-radius: 20px;
            height: 12px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--primary-light), var(--secondary));
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 20px;
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 0.9rem;
            color: var(--text-light);
            font-weight: bold;
        }

        /* محتوى اللعبة */
        .game-content {
            display: flex;
            gap: 30px;
            padding: 40px;
            flex-wrap: wrap;
        }

        /* منطقة الشبكة */
        .grid-section {
            flex: 1.2;
            min-width: 320px;
            display: flex;
            justify-content: center;
        }

        .grid-wrapper {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            overflow-x: auto;
        }

        .crossword-grid {
            display: grid;
            gap: 3px;
            background: #E0E0E0;
            padding: 3px;
            border-radius: 8px;
            margin: 0 auto;
        }

        .cell {
            width: 55px;
            height: 55px;
            background: white;
            border: 2px solid var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-dark);
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Tajawal', monospace;
        }

        @media (max-width: 768px) {
            .cell {
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .cell {
                width: 35px;
                height: 35px;
                font-size: 1.1rem;
            }
        }

        .cell.empty {
            background: #D6D9DB;
            border-color: #BDBDBD;
            cursor: default;
        }

        .cell.active {
            background: var(--secondary-light);
            border-color: var(--secondary);
            transform: scale(1.02);
            box-shadow: inset 0 0 0 2px var(--secondary);
        }

        .cell.highlighted {
            background: #FFF9C4;
        }

        .cell.correct {
            background: linear-gradient(135deg, var(--success-light), var(--success));
            color: white;
            border-color: var(--success);
            animation: correctPulse 0.5s ease;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); background: var(--success-light); }
            50% { transform: scale(1.08); background: var(--success); box-shadow: var(--shadow-glow); }
            100% { transform: scale(1); background: linear-gradient(135deg, var(--success-light), var(--success)); }
        }

        .cell.incorrect-temp {
            background: var(--error);
            color: white;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .cell span.clue-number {
            position: absolute;
            top: 3px;
            right: 5px;
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--primary);
            background: rgba(255,255,255,0.9);
            padding: 1px 4px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* منطقة الأسئلة */
        .clues-section {
            flex: 1;
            min-width: 300px;
        }

        .clues-card {
            background: white;
            border-radius: 24px;
            padding: 25px;
            box-shadow: var(--shadow-md);
            max-height: 600px;
            overflow-y: auto;
        }

        .clues-card::-webkit-scrollbar {
            width: 8px;
        }

        .clues-card::-webkit-scrollbar-track {
            background: #E0E0E0;
            border-radius: 10px;
        }

        .clues-card::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }

        .clues-category {
            margin-bottom: 25px;
        }

        .clues-category h3 {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--secondary);
            display: inline-block;
        }

        .clue-item {
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #F5F5F5;
            color: var(--text-dark);
            font-size: 1rem;
            line-height: 1.5;
        }

        .clue-item:hover {
            background: #E8F5E9;
            transform: translateX(-5px);
        }

        .clue-item.active-clue {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .clue-item.solved {
            opacity: 0.7;
            text-decoration: line-through;
            background: #E8F5E9;
        }

        .clue-number-badge {
            display: inline-block;
            background: var(--secondary);
            color: var(--primary-dark);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            margin-left: 10px;
            font-size: 0.9rem;
        }

        /* منطقة التحكم */
        .control-area {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #E0E0E0;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .answer-input {
            flex: 2;
            padding: 15px 20px;
            font-size: 1.2rem;
            border: 2px solid var(--primary-light);
            border-radius: 16px;
            font-family: 'Tajawal', sans-serif;
            text-align: center;
            transition: all 0.3s ease;
            background: #FAFAFA;
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.2);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--primary-dark);
        }

        .btn-secondary:hover {
            background: var(--secondary-light);
            transform: translateY(-2px);
        }

        .btn-check {
            background: var(--info);
            color: white;
        }

        .btn-check:hover {
            background: #1976D2;
            transform: translateY(-2px);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .feedback {
            min-height: 60px;
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
            font-weight: bold;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background: #E8F5E9;
            color: #2E7D32;
            border-right: 4px solid #4CAF50;
        }

        .feedback.incorrect {
            background: #FFEBEE;
            color: #C62828;
            border-right: 4px solid #F44336;
        }

        .feedback.info {
            background: #E3F2FD;
            color: #1565C0;
            border-right: 4px solid #2196F3;
        }

        /* شاشة النهاية */
        .end-screen {
            text-align: center;
            padding: 60px 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .end-screen h2 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .end-screen p {
            font-size: 1.3rem;
            margin-bottom: 30px;
        }

        .restart-btn {
            background: var(--secondary);
            color: var(--primary-dark);
            padding: 15px 40px;
            font-size: 1.2rem;
        }

        .hidden {
            display: none;
        }

        /* تأثير الـ Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            position: absolute;
            animation: confettiFall 3s linear forwards;
            pointer-events: none;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* إحصائيات */
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding: 10px;
            background: #F5F5F5;
            border-radius: 16px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <a href="#" class="home-btn" onclick="history.back(); return false;">
        <i class="fas fa-home"></i>
        <span>العودة للألعاب</span>
    </a>

    <div class="bg-particles" id="particles"></div>

    <div class="main-container">
        <div class="game-card">
            <div class="game-header">
                <h1><i class="fas fa-mosque"></i> كلمات متقاطعة</h1>
                <p class="subtitle">أركان الإسلام · أركان الإيمان · العقيدة الإسلامية</p>
            </div>

            <div class="progress-section">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-text" id="progressText">0 / 12 كلمة</div>
            </div>

            <div class="game-content" id="gameContent">
                <!-- سيتم تعبئة المحتوى بواسطة JavaScript -->
            </div>

            <div id="endScreen" class="end-screen hidden">
                <i class="fas fa-trophy" style="font-size: 5rem; margin-bottom: 20px;"></i>
                <i class="fas fa-star" style="font-size: 3rem; color: var(--secondary);"></i>
                <h2>🎉 ماشاء الله! 🎉</h2>
                <p>لقد أكملت اللغز بنجاح! أتقنت حفظ أركان الإسلام والإيمان</p>
                <button class="btn restart-btn" onclick="restartGame()">
                    <i class="fas fa-redo"></i> لعبة جديدة
                </button>
            </div>
        </div>
    </div>

    <script>
        // بيانات الكلمات المتقاطعة - أركان الإسلام والإيمان
        const puzzleData = {
            words: [
                // أركان الإسلام الخمسة
                { number: 1, direction: 'across', row: 0, col: 0, answer: "شهادة", clue: "أول أركان الإسلام، وهي النطق بـ 'لا إله إلا الله محمد رسول الله'" },
                { number: 2, direction: 'down', row: 0, col: 0, answer: "صلاة", clue: "ركن من أركان الإسلام، عمود الدين، تؤدى خمس مرات يومياً" },
                { number: 3, direction: 'across', row: 2, col: 1, answer: "زكاة", clue: "ركن من أركان الإسلام، وهي تطهير المال وإعطاء جزء منه للمحتاجين" },
                { number: 4, direction: 'down', row: 0, col: 4, answer: "صوم", clue: "ركن من أركان الإسلام، يُؤدى في شهر رمضان المبارك" },
                { number: 5, direction: 'across', row: 4, col: 0, answer: "حج", clue: "ركن من أركان الإسلام، يُؤدى مرة واحدة في العمر لمن استطاع إليه سبيلاً" },
                
                // أركان الإيمان الستة
                { number: 6, direction: 'down', row: 1, col: 2, answer: "ملائكة", clue: "الركن الثاني من الإيمان، الإيمان بهم وهم مخلوقات من نور" },
                { number: 7, direction: 'across', row: 3, col: 3, answer: "كتب", clue: "الركن الثالث من الإيمان، الإيمان بالكتب المنزلة مثل التوراة والإنجيل والقرآن" },
                { number: 8, direction: 'down', row: 2, col: 3, answer: "رسل", clue: "الركن الرابع من الإيمان، الإيمان بالأنبياء والمرسلين" },
                { number: 9, direction: 'across', row: 5, col: 1, answer: "يوم", clue: "الركن الخامس من الإيمان، الإيمان بـ ... الآخر" },
                { number: 10, direction: 'down', row: 3, col: 4, answer: "قدر", clue: "الركن السادس من الإيمان، الإيمان بـ ... خيره وشره" },
                { number: 11, direction: 'across', row: 1, col: 3, answer: "جنة", clue: "دار النعيم للمؤمنين يوم القيامة" },
                { number: 12, direction: 'down', row: 4, col: 2, answer: "نار", clue: "دار العذاب للكافرين يوم القيامة، وتسمى أيضاً جهنم" }
            ]
        };

        let grid = [];
        let gridRows = 7;
        let gridCols = 6;
        let cells = {};
        let solvedWords = new Set();
        let currentActiveWord = null;
        let currentCells = [];

        function buildGrid() {
            grid = Array(gridRows).fill().map(() => Array(gridCols).fill(''));
            
            puzzleData.words.forEach(word => {
                for (let i = 0; i < word.answer.length; i++) {
                    const row = word.direction === 'across' ? word.row : word.row + i;
                    const col = word.direction === 'across' ? word.col + i : word.col;
                    if (row < gridRows && col < gridCols) {
                        grid[row][col] = word.answer[i];
                    }
                }
            });
        }

        function updateProgress() {
            const total = puzzleData.words.length;
            const solved = solvedWords.size;
            const percent = (solved / total) * 100;
            
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            if (progressBar) {
                progressBar.style.width = percent + '%';
            }
            if (progressText) {
                progressText.textContent = `${solved} / ${total} كلمة`;
            }
        }

        function renderGrid() {
            const gridContainer = document.createElement('div');
            gridContainer.className = 'grid-wrapper';
            
            const gridElem = document.createElement('div');
            gridElem.className = 'crossword-grid';
            gridElem.style.gridTemplateColumns = `repeat(${gridCols}, minmax(35px, 55px))`;
            
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (grid[r][c] === '') {
                        cell.classList.add('empty');
                    } else {
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.textContent = '';
                        
                        // إضافة أرقام الأدلة
                        const wordAtStart = puzzleData.words.find(w => 
                            (w.direction === 'across' && w.row === r && w.col === c) ||
                            (w.direction === 'down' && w.row === r && w.col === c)
                        );
                        
                        if (wordAtStart) {
                            const numberSpan = document.createElement('span');
                            numberSpan.className = 'clue-number';
                            numberSpan.textContent = wordAtStart.number;
                            cell.appendChild(numberSpan);
                        }
                        
                        cell.addEventListener('click', () => selectWordByCell(r, c));
                        cells[`${r}-${c}`] = cell;
                    }
                    gridElem.appendChild(cell);
                }
            }
            
            gridContainer.appendChild(gridElem);
            return gridContainer;
        }

        function renderClues() {
            const cluesContainer = document.createElement('div');
            cluesContainer.className = 'clues-card';
            
            const acrossClues = puzzleData.words.filter(w => w.direction === 'across');
            const downClues = puzzleData.words.filter(w => w.direction === 'down');
            
            let html = `
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="solvedCount">${solvedWords.size}</div>
                        <div class="stat-label">كلمات محلولة</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${puzzleData.words.length}</div>
                        <div class="stat-label">إجمالي الكلمات</div>
                    </div>
                </div>
                <div class="clues-category">
                    <h3><i class="fas fa-arrow-right"></i> كلمات أفقية</h3>
                    <div id="acrossClues">
            `;
            
            acrossClues.forEach(word => {
                const isSolved = solvedWords.has(word.number);
                html += `
                    <div class="clue-item ${isSolved ? 'solved' : ''}" data-number="${word.number}" data-direction="across" onclick="selectWord(${word.number}, 'across')">
                        <span class="clue-number-badge">${word.number}</span>
                        ${word.clue}
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
                <div class="clues-category">
                    <h3><i class="fas fa-arrow-down"></i> كلمات عمودية</h3>
                    <div id="downClues">
            `;
            
            downClues.forEach(word => {
                const isSolved = solvedWords.has(word.number);
                html += `
                    <div class="clue-item ${isSolved ? 'solved' : ''}" data-number="${word.number}" data-direction="down" onclick="selectWord(${word.number}, 'down')">
                        <span class="clue-number-badge">${word.number}</span>
                        ${word.clue}
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
                <div class="control-area">
                    <div class="input-group">
                        <input type="text" id="answerInput" class="answer-input" placeholder="اكتب الإجابة هنا..." maxlength="15" dir="rtl">
                        <button class="btn btn-primary" onclick="submitAnswer()">
                            <i class="fas fa-check"></i> تحقق
                        </button>
                    </div>
                    <div id="feedback" class="feedback" style="display: none;"></div>
                    <div class="btn-group">
                        <button class="btn btn-secondary" onclick="getHint()">
                            <i class="fas fa-lightbulb"></i> تلميح
                        </button>
                        <button class="btn btn-check" onclick="checkAll()">
                            <i class="fas fa-clipboard-list"></i> تحقق من الكل
                        </button>
                    </div>
                </div>
            `;
            
            cluesContainer.innerHTML = html;
            return cluesContainer;
        }

        function updateCluesUI() {
            puzzleData.words.forEach(word => {
                const clueItem = document.querySelector(`.clue-item[data-number="${word.number}"][data-direction="${word.direction}"]`);
                if (clueItem) {
                    if (solvedWords.has(word.number)) {
                        clueItem.classList.add('solved');
                    } else {
                        clueItem.classList.remove('solved');
                    }
                }
            });
            
            const solvedCountSpan = document.getElementById('solvedCount');
            if (solvedCountSpan) {
                solvedCountSpan.textContent = solvedWords.size;
            }
        }

        function highlightWord(number, direction) {
            // إزالة التظليل السابق
            if (currentCells.length) {
                currentCells.forEach(cell => {
                    if (cell) cell.classList.remove('active', 'highlighted');
                });
            }
            
            const word = puzzleData.words.find(w => w.number === number && w.direction === direction);
            if (!word) return;
            
            currentActiveWord = word;
            currentCells = [];
            
            for (let i = 0; i < word.answer.length; i++) {
                const row = word.direction === 'across' ? word.row : word.row + i;
                const col = word.direction === 'across' ? word.col + i : word.col;
                const cell = cells[`${row}-${col}`];
                if (cell) {
                    cell.classList.add('active', 'highlighted');
                    currentCells.push(cell);
                }
            }
            
            // تحديث التظليل في قائمة الأدلة
            document.querySelectorAll('.clue-item').forEach(item => {
                item.classList.remove('active-clue');
                if (item.dataset.number == number && item.dataset.direction === direction) {
                    item.classList.add('active-clue');
                }
            });
            
            const input = document.getElementById('answerInput');
            if (input) {
                input.value = '';
                input.focus();
                input.readOnly = solvedWords.has(number);
                if (solvedWords.has(number)) {
                    input.value = word.answer;
                    showFeedback(`✨ هذه الكلمة محلولة بالفعل: ${word.answer}`, 'info');
                }
            }
        }

        function selectWord(number, direction) {
            highlightWord(number, direction);
        }

        function selectWordByCell(row, col) {
            // البحث عن الكلمة التي تحتوي هذه الخلية - تفضيل الكلمة الأفقية أولاً
            const acrossWord = puzzleData.words.find(w => 
                w.direction === 'across' && w.row === row && col >= w.col && col < w.col + w.answer.length
            );
            
            const downWord = puzzleData.words.find(w => 
                w.direction === 'down' && w.col === col && row >= w.row && row < w.row + w.answer.length
            );
            
            if (acrossWord && (!currentActiveWord || currentActiveWord.direction !== 'across')) {
                highlightWord(acrossWord.number, acrossWord.direction);
            } else if (downWord) {
                highlightWord(downWord.number, downWord.direction);
            } else if (acrossWord) {
                highlightWord(acrossWord.number, acrossWord.direction);
            }
        }

        function showFeedback(message, type) {
            const feedbackDiv = document.getElementById('feedback');
            if (feedbackDiv) {
                feedbackDiv.textContent = message;
                feedbackDiv.className = `feedback ${type}`;
                feedbackDiv.style.display = 'block';
                
                setTimeout(() => {
                    feedbackDiv.style.display = 'none';
                }, 3000);
            }
        }

        function createConfetti() {
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.position = 'fixed';
                confetti.style.top = '-10px';
                confetti.style.width = Math.random() * 8 + 4 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        function submitAnswer() {
            if (!currentActiveWord) {
                showFeedback('📌 الرجاء اختيار كلمة أولاً (اضغط على أي خانة أو سؤال)', 'incorrect');
                return;
            }
            
            if (solvedWords.has(currentActiveWord.number)) {
                showFeedback(`✅ "${currentActiveWord.answer}" تم حلها مسبقاً!`, 'correct');
                return;
            }
            
            const input = document.getElementById('answerInput');
            const userAnswer = input.value.trim();
            const correctAnswer = currentActiveWord.answer;
            
            // تطبيع الحروف العربية
            const normalize = (str) => {
                return str.replace(/[أإآ]/g, 'ا').replace(/[ة]/g, 'ه').replace(/[ى]/g, 'ي');
            };
            
            if (normalize(userAnswer) === normalize(correctAnswer)) {
                // إجابة صحيحة
                solvedWords.add(currentActiveWord.number);
                
                // ملء الخلايا وتطبيق التأثير البصري
                currentCells.forEach((cell, idx) => {
                    cell.textContent = currentActiveWord.answer[idx];
                    cell.classList.remove('active', 'highlighted');
                    cell.classList.add('correct');
                    
                    // تأثير نبض إضافي
                    cell.style.animation = 'none';
                    setTimeout(() => {
                        cell.style.animation = 'correctPulse 0.5s ease';
                    }, 10);
                });
                
                updateCluesUI();
                updateProgress();
                
                showFeedback(`🌟 أحسنت! ${currentActiveWord.answer} - ${currentActiveWord.clue}`, 'correct');
                
                // التحقق من اكتمال اللغز
                if (solvedWords.size === puzzleData.words.length) {
                    setTimeout(() => {
                        showCompletion();
                    }, 800);
                } else {
                    // إلغاء تحديد الكلمة الحالية
                    currentActiveWord = null;
                    currentCells = [];
                    document.getElementById('answerInput').value = '';
                }
            } else {
                // إجابة خاطئة
                showFeedback(`❌ إجابة خاطئة! "${userAnswer}" ليست الإجابة الصحيحة. حاول مرة أخرى`, 'incorrect');
                
                // تأثير اهتزاز للخلايا
                currentCells.forEach(cell => {
                    cell.classList.add('incorrect-temp');
                    setTimeout(() => {
                        cell.classList.remove('incorrect-temp');
                    }, 300);
                });
            }
        }

        function getHint() {
            if (!currentActiveWord) {
                showFeedback('📌 اختر كلمة أولاً للحصول على تلميح (اضغط على أي خانة أو سؤال)', 'info');
                return;
            }
            
            if (solvedWords.has(currentActiveWord.number)) {
                showFeedback(`✨ "${currentActiveWord.answer}" مكتملة بالفعل!`, 'info');
                return;
            }
            
            // البحث عن أول حرف غير مكتوب
            for (let i = 0; i < currentActiveWord.answer.length; i++) {
                const row = currentActiveWord.direction === 'across' ? currentActiveWord.row : currentActiveWord.row + i;
                const col = currentActiveWord.direction === 'across' ? currentActiveWord.col + i : currentActiveWord.col;
                const cell = cells[`${row}-${col}`];
                
                if (cell && !cell.textContent) {
                    cell.textContent = currentActiveWord.answer[i];
                    cell.style.backgroundColor = '#FFF9C4';
                    setTimeout(() => {
                        cell.style.backgroundColor = '';
                    }, 1000);
                    showFeedback(`💡 تلميح: الحرف "${currentActiveWord.answer[i]}" تم كشفه في الخانة ${i+1}`, 'info');
                    return;
                }
            }
            
            showFeedback('📝 جميع الحروف مكتملة في هذه الكلمة! جرب الإجابة', 'info');
        }

        function checkAll() {
            let newlySolved = false;
            
            puzzleData.words.forEach(word => {
                if (!solvedWords.has(word.number)) {
                    let wordCorrect = true;
                    for (let i = 0; i < word.answer.length; i++) {
                        const row = word.direction === 'across' ? word.row : word.row + i;
                        const col = word.direction === 'across' ? word.col + i : word.col;
                        const cell = cells[`${row}-${col}`];
                        if (cell && cell.textContent !== word.answer[i]) {
                            wordCorrect = false;
                            cell.classList.add('incorrect-temp');
                            setTimeout(() => cell.classList.remove('incorrect-temp'), 500);
                        }
                    }
                    
                    if (wordCorrect && !solvedWords.has(word.number)) {
                        solvedWords.add(word.number);
                        newlySolved = true;
                        for (let i = 0; i < word.answer.length; i++) {
                            const row = word.direction === 'across' ? word.row : word.row + i;
                            const col = word.direction === 'across' ? word.col + i : word.col;
                            const cell = cells[`${row}-${col}`];
                            if (cell && !cell.classList.contains('correct')) {
                                cell.classList.add('correct');
                                cell.textContent = word.answer[i];
                            }
                        }
                    }
                }
            });
            
            updateCluesUI();
            updateProgress();
            
            if (solvedWords.size === puzzleData.words.length) {
                showCompletion();
            } else if (newlySolved) {
                showFeedback('🎉 أحسنت! تم تصحيح الكلمات الصحيحة تلقائياً', 'correct');
            } else {
                showFeedback('⚠️ بعض الكلمات لا تزال خاطئة أو ناقصة، استمر في المحاولة!', 'incorrect');
            }
        }

        function showCompletion() {
            const gameContent = document.getElementById('gameContent');
            const endScreen = document.getElementById('endScreen');
            
            gameContent.classList.add('hidden');
            endScreen.classList.remove('hidden');
            createConfetti();
            
            // إنشاء تأثير احتفالي إضافي
            setTimeout(() => createConfetti(), 300);
            setTimeout(() => createConfetti(), 600);
        }

        function restartGame() {
            solvedWords.clear();
            currentActiveWord = null;
            currentCells = [];
            
            buildGrid();
            
            const gameContent = document.getElementById('gameContent');
            const endScreen = document.getElementById('endScreen');
            
            gameContent.innerHTML = '';
            gameContent.classList.remove('hidden');
            endScreen.classList.add('hidden');
            
            const gridSection = document.createElement('div');
            gridSection.className = 'grid-section';
            gridSection.appendChild(renderGrid());
            
            const cluesSection = document.createElement('div');
            cluesSection.className = 'clues-section';
            cluesSection.appendChild(renderClues());
            
            gameContent.appendChild(gridSection);
            gameContent.appendChild(cluesSection);
            
            updateProgress();
            
            // إعادة ربط الدوال العامة
            window.selectWord = selectWord;
            window.submitAnswer = submitAnswer;
            window.getHint = getHint;
            window.checkAll = checkAll;
            window.restartGame = restartGame;
        }

        // إنشاء جسيمات الخلفية
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 80 + 30 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = Math.random() * 20 + 15 + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // تهيئة اللعبة
        buildGrid();
        createParticles();
        restartGame();
    </script>
</body>
</html>
